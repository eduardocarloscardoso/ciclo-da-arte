<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
:root{--navy:#0f1623;--navy2:#161f30;--navy3:#1e2b3f;--red:#e8334a;--red2:#c42a3f;--gold:#c9943a;--gold2:#f0c060;--teal:#2ec4b6;--purple:#9b72cf;--green:#3ec97a;--blue:#4a9eff;--white:#f5f3ee;--muted:#7a8499;--muted2:#a0aab8;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.07);--ff-d:'Playfair Display',serif;--ff-b:'DM Sans',sans-serif;--ff-m:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff-b);background:var(--navy);color:var(--white);min-height:100vh;overflow-x:hidden}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(232,51,74,.12),transparent),radial-gradient(ellipse 60% 40% at 90% 90%,rgba(201,148,58,.08),transparent)}
.login-box{background:var(--navy2);border:1px solid var(--border2);border-radius:16px;padding:40px;width:380px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .brand{font-family:var(--ff-d);font-size:26px;font-weight:900}
.login-logo .brand span{color:var(--gold)}
.login-logo .sub{font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}
.login-subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-label{font-size:11px;font-weight:600;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;background:var(--navy3);border:1px solid var(--border2);border-radius:8px;color:var(--white);font-family:var(--ff-b);font-size:14px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--red)}
.form-input::placeholder{color:var(--muted)}
select.form-input option{background:var(--navy3);color:var(--white)}
.login-btn{width:100%;padding:12px;background:var(--red);border:none;border-radius:8px;color:#fff;font-family:var(--ff-b);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px}
.login-btn:hover{background:var(--red2);transform:translateY(-1px)}
.login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.login-error{background:rgba(232,51,74,.1);border:1px solid rgba(232,51,74,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#ff8090;margin-top:12px;display:none;text-align:center}
.quick-access{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.quick-label{font-size:11px;color:var(--muted);text-align:center;margin-bottom:12px;letter-spacing:.08em;text-transform:uppercase}
.quick-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{padding:9px;border-radius:6px;border:1px solid var(--border2);background:var(--card);cursor:pointer;text-align:center;transition:all .2s}
.qbtn:hover{background:var(--card2);border-color:rgba(255,255,255,.2)}
.qbtn .qname{font-size:12px;font-weight:600;color:var(--white)}
.qbtn .qrole{font-size:10px;color:var(--muted);margin-top:2px}
#app{display:none;flex-direction:row;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform .22s ease}
.sidebar.sb-hidden{transform:translateX(-100%)}
.main{margin-left:220px;flex:1;min-height:100vh;transition:margin-left .22s ease}
.main.sb-full{margin-left:0}
.sb-toggle{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:var(--card);border:1px solid var(--border2);color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:14px}
.sb-toggle:hover{background:var(--card2);color:var(--white)}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.sb-logo .brand{font-family:var(--ff-d);font-size:16px;font-weight:900}
.sb-logo .brand span{color:var(--gold)}
.sb-logo .sub{font-size:9px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:2px}
.sb-user{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-user-info .name{font-size:12px;font-weight:600;line-height:1.2}
.sb-user-info .role{font-size:10px;color:var(--muted)}
.sb-nav{flex:1;padding:12px 0;overflow-y:auto}
.sb-section{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:10px 20px 5px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 20px;cursor:pointer;font-size:12.5px;font-weight:500;color:#8a9ab5;transition:all .18s;border-left:3px solid transparent}
.nav-item:hover{color:var(--white);background:var(--card)}
.nav-item.active{color:var(--white);background:var(--card);border-left-color:var(--red)}
.nav-item.locked{opacity:.3;pointer-events:none}
.nav-icon{font-size:13px;width:18px;text-align:center}
.sb-footer{padding:14px 20px;border-top:1px solid var(--border)}
.logout-btn{width:100%;padding:8px;border-radius:6px;background:var(--card);border:1px solid var(--border2);color:var(--muted2);font-family:var(--ff-b);font-size:12px;cursor:pointer;transition:all .2s}
.logout-btn:hover{background:rgba(232,51,74,.1);color:var(--red);border-color:rgba(232,51,74,.3)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,22,35,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-family:var(--ff-d);font-size:17px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{font-size:11px;color:var(--muted);font-family:var(--ff-m)}
.content{padding:28px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ph{margin-bottom:24px}
.ph h1{font-family:var(--ff-d);font-size:24px;font-weight:900}
.ph p{color:var(--muted);font-size:13px;margin-top:4px}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;transition:all .2s}
.kpi-card:hover{background:var(--card2);transform:translateY(-2px)}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.kpi-card.c-red::after{background:var(--red)}.kpi-card.c-gold::after{background:var(--gold)}.kpi-card.c-teal::after{background:var(--teal)}.kpi-card.c-purple::after{background:var(--purple)}
.kpi-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.kpi-value{font-family:var(--ff-d);font-size:22px;font-weight:900;margin:6px 0 4px}
.kpi-sub{font-size:11px;color:var(--muted)}
.kpi-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:6px}
.kpi-badge.up{background:rgba(62,201,122,.15);color:var(--green)}.kpi-badge.warn{background:rgba(201,148,58,.15);color:var(--gold2)}.kpi-badge.down{background:rgba(232,51,74,.15);color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px}
.card-title{font-family:var(--ff-d);font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cdot.red{background:var(--red)}.cdot.gold{background:var(--gold)}.cdot.teal{background:var(--teal)}.cdot.purple{background:var(--purple)}.cdot.green{background:var(--green)}.cdot.blue{background:var(--blue)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge-done{background:rgba(62,201,122,.15);color:var(--green)}.badge-active{background:rgba(201,148,58,.2);color:var(--gold2)}.badge-pending{background:rgba(255,255,255,.07);color:var(--muted2)}.badge-alert{background:rgba(232,51,74,.15);color:var(--red)}.badge-ia{background:rgba(155,114,207,.2);color:#c49aff}.badge-interno{background:rgba(46,196,182,.15);color:var(--teal)}.badge-agencia{background:rgba(201,148,58,.15);color:var(--gold)}
.prog-item{margin-bottom:13px}
.prog-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.prog-head span:last-child{color:var(--muted)}
.prog-track{height:6px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:10px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.prog-fill.red{background:linear-gradient(90deg,var(--red),#ff6b7a)}.prog-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold2))}.prog-fill.teal{background:linear-gradient(90deg,var(--teal),#6ef0e8)}.prog-fill.purple{background:linear-gradient(90deg,var(--purple),#c49aff)}.prog-fill.green{background:linear-gradient(90deg,var(--green),#7eeaaa)}.prog-fill.blue{background:linear-gradient(90deg,var(--blue),#90c5ff)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:9px 13px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:background .15s}
tbody tr:hover{background:var(--card2)}
tbody td{padding:11px 13px;vertical-align:middle}
.td-name{font-weight:600;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s}
.tab:hover{color:var(--white)}
.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all .22s}
.mod-card:hover{background:var(--card2);transform:translateY(-3px);border-color:var(--border2)}
.mod-num{font-family:var(--ff-m);font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:6px}
.mod-name{font-family:var(--ff-d);font-size:14px;font-weight:700;margin-bottom:3px}
.mod-role{font-size:11px;color:var(--muted);margin-bottom:13px}
.mod-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}
.mini-prog{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:10px}
.mini-prog-fill{height:100%;border-radius:4px}
.gantt{overflow-x:auto}
.gantt-grid{min-width:720px}
.gantt-head{display:grid;grid-template-columns:175px repeat(12,1fr);margin-bottom:3px}
.g-month{font-size:9px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding:5px 1px}
.gantt-row{display:grid;grid-template-columns:175px repeat(12,1fr);margin-bottom:5px;align-items:center}
.g-label{font-size:11px;font-weight:600;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.g-label .gs{font-size:9px;color:var(--muted);font-weight:400}
.g-cell{height:24px;display:flex;align-items:center;padding:0 1px}
.g-bar{height:16px;border-radius:3px;width:100%}
.g-bar.red{background:rgba(232,51,74,.55)}.g-bar.gold{background:rgba(201,148,58,.55)}.g-bar.teal{background:rgba(46,196,182,.45)}.g-bar.purple{background:rgba(155,114,207,.45)}.g-bar.green{background:rgba(62,201,122,.45)}.g-bar.blue{background:rgba(74,158,255,.45)}
.g-today{background:rgba(201,148,58,.06);border-left:2px solid rgba(201,148,58,.4)}
.action-item{background:var(--card);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;transition:all .2s}
.action-header{padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.action-header:hover{background:var(--card2);border-radius:9px}
.action-check{width:18px;height:18px;border-radius:4px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:10px}
.action-check.done{background:var(--green);border-color:var(--green);color:#fff}
.action-check.active{background:var(--gold);border-color:var(--gold);color:#fff}
.action-body{flex:1;min-width:0}
.action-title{font-size:13px;font-weight:600;margin-bottom:3px}
.action-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.action-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.action-expand-btn{font-size:11px;color:var(--muted);padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;transition:all .2s;white-space:nowrap}
.action-expand-btn:hover{color:var(--white);border-color:var(--border2)}
.tarefas-container{padding:0 16px 14px 46px;animation:fadeUp .2s ease}
.tarefas-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tarefas-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tarefa-item{background:var(--navy3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:7px;transition:all .2s}
.tarefa-item:hover{border-color:var(--border2)}
.tarefa-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.tarefa-titulo{font-size:13px;font-weight:600;line-height:1.3}
.tarefa-status-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tarefa-info{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tarefa-field{font-size:11px;color:var(--muted)}
.tarefa-field span{color:var(--muted2);font-weight:500}
.tarefa-obs{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-style:italic}
.tarefa-actions{display:flex;gap:5px;margin-top:8px;justify-content:flex-end}
.btn-tarefa{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:var(--ff-b)}
.btn-tarefa.edit{background:rgba(255,255,255,.06);color:var(--muted2)}.btn-tarefa.edit:hover{background:rgba(255,255,255,.1);color:var(--white)}
.btn-tarefa.del{background:rgba(232,51,74,.1);color:var(--red)}.btn-tarefa.del:hover{background:rgba(232,51,74,.2)}
.btn-nova-tarefa{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;background:rgba(232,51,74,.12);border:1px dashed rgba(232,51,74,.4);color:var(--red);font-family:var(--ff-b);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px}
.btn-nova-tarefa:hover{background:rgba(232,51,74,.2)}
.tarefa-status-sel{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:var(--ff-b);letter-spacing:.04em}
.tarefa-status-sel.done{background:rgba(62,201,122,.15);color:var(--green)}
.tarefa-status-sel.active{background:rgba(201,148,58,.2);color:var(--gold2)}
.tarefa-status-sel.pending{background:rgba(255,255,255,.07);color:var(--muted2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeUp .2s ease}
.modal-box{background:var(--navy2);border:1px solid var(--border2);border-radius:16px;padding:32px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--ff-d);font-size:18px;font-weight:900;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
.btn{padding:9px 20px;border-radius:8px;font-family:var(--ff-b);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red2)}
.btn-ghost{background:var(--card);color:var(--muted2);border:1px solid var(--border2)}.btn-ghost:hover{color:var(--white);background:var(--card2)}
.btn-danger{background:rgba(232,51,74,.15);color:var(--red);border:1px solid rgba(232,51,74,.3)}.btn-danger:hover{background:rgba(232,51,74,.25)}
.btn-sm{padding:5px 13px;font-size:11px;border-radius:6px}
.btn-add{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:var(--red);color:#fff;font-family:var(--ff-b);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-add:hover{background:var(--red2)}
.btn-excel{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:rgba(62,201,122,.15);color:var(--green);border:1px solid rgba(62,201,122,.3);font-family:var(--ff-b);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-excel:hover{background:rgba(62,201,122,.25)}
.btn-import{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:rgba(74,158,255,.15);color:var(--blue);border:1px solid rgba(74,158,255,.3);font-family:var(--ff-b);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-import:hover{background:rgba(74,158,255,.25)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--navy3);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;animation:fadeUp .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.success{border-color:rgba(62,201,122,.4);color:var(--green)}
.toast.error{border-color:rgba(232,51,74,.4);color:var(--red)}
.toast.info{border-color:rgba(74,158,255,.4);color:var(--blue)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.av.red{background:rgba(232,51,74,.25);color:var(--red)}.av.gold{background:rgba(201,148,58,.25);color:var(--gold2)}.av.teal{background:rgba(46,196,182,.25);color:var(--teal)}.av.purple{background:rgba(155,114,207,.25);color:var(--purple)}.av.green{background:rgba(62,201,122,.25);color:var(--green)}.av.blue{background:rgba(74,158,255,.25);color:var(--blue)}
.access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;text-align:center}
.access-denied .icon{font-size:48px;margin-bottom:16px;opacity:.4}
.access-denied h2{font-family:var(--ff-d);font-size:22px;margin-bottom:8px;opacity:.7}

headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},

var PROJETOS={
  comercial:{icon:'🛍',label:'Comercial',desc:'CRM, clientes e vendas'},
  marketing:{icon:'📣',label:'Marketing',desc:'Roadmap, ações e KPIs'},

var PM={dashboard:{icon:'📊',label:'Dashboard'},roadmap:{icon:'🗺',label:'Roadmap'},modulos:{icon:'🧩',label:'Módulos'},kpis:{icon:'📈',label:'KPIs & Metas'},acoes:{icon:'✅',label:'Plano de Ações'},equipe:{icon:'👥',label:'Equipe & Acessos'},config:{icon:'⚙',label:'Configurações'},credenciamento:{icon:'🔑',label:'Credenciamento de Usuários'}};

var RECEITAS=[{canal:'E-commerce',atual:22500,meta:40000,pct:56,color:'red'},{canal:'Lojas Itinerantes',atual:25000,meta:40000,pct:62,color:'gold'},{canal:'Feiras e Eventos',atual:24000,meta:40000,pct:60,color:'teal'},{canal:'Rede de Revendas',atual:21000,meta:40000,pct:52,color:'purple'}];
function initials(n){var p=n.trim().split(' ');return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function tipoBadge(t){return t==='IA'?'ia':t==='Interno'?'interno':t==='Agência'?'agencia':'ia';}
function fmtDate(d){if(!d)return'—';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function parseDate(d){if(!d)return null;d=String(d).trim();if(d.includes('/')){var p=d.split('/');if(p.length===3)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');}if(d.includes('-'))return d;return null;}
function statusNorm(s){if(!s)return'pending';s=String(s).toLowerCase().trim();if(s==='concluída'||s==='concluida'||s==='done'||s==='feito')return'done';if(s==='em andamento'||s==='active'||s==='ativo'||s==='ativa')return'active';return'pending';}
function showToast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'success');t.innerHTML=(type==='error'?'❌':type==='info'?'ℹ️':'✅')+' '+msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(function(){t.remove();},400);},3000);}

function isReadOnly(){return cu&&cu.permissao==='leitura';}
function canAccess(page){return RC[cu.role]&&RC[cu.role].pages.indexOf(page)>=0;}
function canAccessProject(projKey){return cu&&(cu.is_admin||(cu.projetos||[]).indexOf(projKey)>=0);}

async function initApp(){
  // Restaurar sessão real (Supabase Auth) — funciona ao voltar de outro
  // projeto sem precisar logar de novo.
  try{
    var {data:{session}}=await sbAuth.auth.getSession();
    if(session&&session.access_token){
      sb.headers.Authorization='Bearer '+session.access_token;
      var equipeRows=await sb.get('equipe','order=id');
      EQUIPE=equipeRows;
      var m=equipeRows.find(function(x){return x.email===session.user.email;});
      if(m){
        cu={id:m.id,name:m.name,email:m.email,role:m.acesso,color:m.color,initials:m.initials,is_admin:!!m.is_admin,permissao:m.permissao||'leitura_escrita',projetos:m.projetos||[]};
        document.getElementById('login-screen').style.display='none';
        document.getElementById('app').style.display='flex';
        setDate();await setupProjectSidebar();
        document.getElementById('page-title').textContent='Selecione um módulo';
        document.getElementById('main-content').innerHTML='<div class="ph"><h1>👋 Bem-vindo(a), '+(cu.name||'')+'</h1><p>Escolha um módulo no menu ao lado para continuar.</p></div>';
      }
    }
  }catch(e){/* sem sessão válida — mantém tela de login */}
}
async function doLogin(){
  var btn=document.getElementById('login-btn');btn.disabled=true;btn.textContent='Entrando...';
  var u=document.getElementById('inp-user').value.trim().toLowerCase();
  var p=document.getElementById('inp-pass').value;
  try{
    var {data,error}=await sbAuth.auth.signInWithPassword({email:u,password:p});
    if(error||!data.session){
      var el=document.getElementById('login-error');el.style.display='block';setTimeout(function(){el.style.display='none';},3000);
      btn.disabled=false;btn.textContent='Entrar no Sistema';return;
    }
    sb.headers.Authorization='Bearer '+data.session.access_token;
    EQUIPE=await sb.get('equipe','order=id');
    var m=EQUIPE.find(function(x){return x.email===u;});
    if(m){
      cu={id:m.id,name:m.name,email:m.email,role:m.acesso,color:m.color,initials:m.initials,is_admin:!!m.is_admin,permissao:m.permissao||'leitura_escrita',projetos:m.projetos||[]};
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='flex';
      setDate();await setupProjectSidebar();
      document.getElementById('page-title').textContent='Selecione um módulo';
      document.getElementById('main-content').innerHTML='<div class="ph"><h1>👋 Bem-vindo(a), '+(cu.name||'')+'</h1><p>Escolha um módulo no menu ao lado para continuar.</p></div>';
    }else{
      await sbAuth.auth.signOut();
      var el2=document.getElementById('login-error');el2.style.display='block';setTimeout(function(){el2.style.display='none';},3000);
    }
  }catch(e){showToast('Erro de conexão com o banco de dados','error');}
  btn.disabled=false;btn.textContent='Entrar no Sistema';
}
async function loadData(){
  try{ACOES=await sb.get('acoes','order=id');MODULOS=await sb.get('modulos','order=id');TAREFAS=await sb.get('tarefas','order=id');}
  catch(e){console.error('Erro ao carregar dados',e);}
}
async function doLogout(){
  await sbAuth.auth.signOut();
  cu=null;ACOES=[];MODULOS=[];TAREFAS=[];expandedAcoes={};currentProject=null;
  sb.headers.Authorization='Bearer '+SUPABASE_KEY;
  document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex';document.getElementById('inp-user').value='';document.getElementById('inp-pass').value='';
}

function applySidebarState(){
  var hidden = false;
  try{ hidden = localStorage.getItem('cda_sidebar_oculta') === '1'; }catch(e){}
  document.querySelector('.sidebar').classList.toggle('sb-hidden', hidden);
  document.querySelector('.main').classList.toggle('sb-full', hidden);
}
var CU_PERMISSOES_SUBMODULO=null; // {projeto: {slug: nivel} | null} — null = sem configuração granular (mostra tudo, rede de segurança)
async function carregarPermissoesUsuarioAtual(){
  CU_PERMISSOES_SUBMODULO={};
  if(!cu||!cu.id)return;
  try{
    var {data,error}=await cdaClient.from('cda_equipe_permissoes').select('submodulo_id,nivel,cda_permissoes_catalogo(projeto,submodulo_slug)').eq('equipe_id',cu.id);
    if(error){console.error(error);return;}
    (data||[]).forEach(function(row){
      var cat=row.cda_permissoes_catalogo;
      if(!cat)return;
      if(!CU_PERMISSOES_SUBMODULO[cat.projeto])CU_PERMISSOES_SUBMODULO[cat.projeto]={};
      CU_PERMISSOES_SUBMODULO[cat.projeto][cat.submodulo_slug]=row.nivel;
    });
  }catch(e){console.error(e);}
}
function podeVerSubmodulo(projeto,slug){
  if(!cu)return true;
  if(cu.is_admin)return true;
  var doProjeto=CU_PERMISSOES_SUBMODULO&&CU_PERMISSOES_SUBMODULO[projeto];
  if(!doProjeto)return true; // ninguém configurou nada pra esse projeto ainda — rede de segurança: mostra tudo
  if(!doProjeto.hasOwnProperty(slug))return false; // projeto já configurado, mas este submódulo não tem linha = tratado como negado
  return doProjeto[slug]!=='desabilitado';
}

async function openProject(key){
  currentProject=key;
  document.getElementById('page-title').textContent=PROJETOS[key]?PROJETOS[key].label:(PM[key]?PM[key].label:key);
  renderSidebarNav();
  var el=document.getElementById('main-content');
  var iframeWrap0=document.getElementById('financeiro-iframe-wrap');
  if(key!=='comercial'&&key!=='financeiro'&&iframeWrap0) iframeWrap0.style.display='none';
  var roBanner=isReadOnly()?'<div class="readonly-banner">👁 Modo somente leitura — seu usuário não tem permissão para alterar dados neste sistema.</div>':'';
  if(key==='credenciamento'){el.innerHTML=roBanner;renderCredenciamento(el);return;}
  if(key==='seguranca'){
    el.innerHTML=roBanner+'<div class="crm-embed">'+
      '<div class="sec-t">Segurança</div><div class="sec-d">Backup e restauração dos dados do Financeiro (Prestação de Contas, Cardápios, Canais)</div>'+
      '<div class="cc" style="max-width:520px"><h3>💾 Backup de Dados</h3><p class="tmu" style="margin-bottom:10px">Baixa um arquivo .json com uma cópia completa dos dados do Financeiro. Guarde antes de fazer alterações grandes.</p>'+
      '<button class="btn rust" id="seg-btn-backup">💾 Fazer Backup Agora</button></div>'+
      '<div class="cc" style="max-width:520px;margin-top:16px"><h3>⬆ Restaurar Backup</h3><p class="tmu" style="margin-bottom:10px">Restaura os dados a partir de um arquivo .json de backup gerado anteriormente. <b>Isso substitui os dados atuais</b> — use com cuidado.</p>'+
      '<input type="file" id="seg-restore-input" accept=".json" style="display:none">'+
      '<button class="btn" id="seg-btn-restaurar">⬆ Escolher Arquivo e Restaurar</button></div>'+
      '</div>';
    document.getElementById('seg-btn-backup').addEventListener('click', hubBackupFinanceiro);
    document.getElementById('seg-restore-input').addEventListener('change', function(){ hubRestaurarBackupFinanceiro(this); });
    document.getElementById('seg-btn-restaurar').addEventListener('click', function(){ document.getElementById('seg-restore-input').click(); });
    return;
  }
  if(key==='marketing'){
    if(!ACOES.length&&!MODULOS.length)await loadData();
    window._marketingPage='dashboard';renderSidebarNav();
    el.innerHTML=roBanner+'<div id="marketing-content"></div>';
    navigate('dashboard');
    return;
  }
  if(key==='comercial'||key==='financeiro'){
    navigateCRM('clientes');
    return;
  }
  if(key==='sac'){el.innerHTML=roBanner+'<div class="ph"><h1>🎧 SAC Cliente</h1><p>Atendimento e suporte</p></div><div class="rec-box"><div class="rec-title">🚧 Em construção</div><p>Módulo novo — aguardando definição de escopo.</p></div>';return;}
  if(key==='calendario'){el.innerHTML=roBanner+'<div class="ph"><h1>📅 Calendário e Ações/Eventos</h1><p>Agenda consolidada</p></div><div class="rec-box"><div class="rec-title">🚧 Em construção</div><p>Módulo novo — aguardando definição de escopo.</p></div>';return;}
}

function garantirIframeFinanceiroCarregado(callback){
  var frame=document.getElementById('financeiro-iframe');
  if(frame.dataset.loaded){ callback(); return; }
  frame.src='/financeiro.html#dash';
  frame.dataset.loaded='1';
  frame.dataset.currentPage='dash';
  frame.onload=function(){ setTimeout(callback, 600); };
}
function hubBackupFinanceiro(){
  garantirIframeFinanceiroCarregado(function(){
    try{ document.getElementById('financeiro-iframe').contentWindow.backupSistema(); }
    catch(e){ alert('Erro ao gerar backup — tenta de novo em alguns segundos.'); console.error(e); }
  });
}
function hubRestaurarBackupFinanceiro(el){
  garantirIframeFinanceiroCarregado(function(){
    try{ document.getElementById('financeiro-iframe').contentWindow.restaurarBackup(el); }
    catch(e){ alert('Erro ao restaurar — tenta de novo em alguns segundos.'); console.error(e); }
  });
}
async function navigateCRM(pageId){

    return;
  }
  window._crmPage=pageId;
  renderSidebarNav();
  var EXTRA_TITLES={pipelineb2c:'Pipeline B2C',painelgerencial:'Painel Gerencial',campanhas:'Campanhas',tarefas:'Tarefas & Follow-up',tutorial:'Tutorial',canais:'Canais de Venda',cvpage:'Collabs / Vendedores',cfgfin:'Tipos e Coleções',prest:'Prestação de Contas',upload:'Importar Planilha',cardapios:'Cardápios'};
  document.getElementById('page-title').textContent=CRM_PAGES[pageId]?CRM_PAGES[pageId].label:(EXTRA_TITLES[pageId]||pageId);
  var el=document.getElementById('main-content');
  var iframeWrap=document.getElementById('financeiro-iframe-wrap');
  if(pageId!=='prest'&&pageId!=='upload'&&pageId!=='cardapios'&&iframeWrap) iframeWrap.style.display='none';
  var roBanner=isReadOnly()?'<div class="readonly-banner">👁 Modo somente leitura — seu usuário não tem permissão para alterar dados neste sistema.</div>':'';
  var podeEditarCompras=(currentProject==='financeiro')&&!isReadOnly();
  var podeEditar=!isReadOnly();
  if(pageId==='clientes'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-clientes"></div></div>';
    montarModuloClientes('container-clientes');
  }else if(pageId==='compras'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-compras"></div></div>';
    montarModuloCompras('container-compras',{editavel:podeEditarCompras});
  }else if(pageId==='produtos'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-produtos"></div></div>';
    montarModuloProdutos('container-produtos',{editavel:podeEditar});
  }else if(pageId==='segmentacao'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-segmentacao"></div></div>';
    montarModuloSegmentacao('container-segmentacao');
  }else if(pageId==='pipelineb2c'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-pipeline-b2c"></div></div>';
    montarModuloPipelineB2C('container-pipeline-b2c');
  }else if(pageId==='painelgerencial'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-painel-gerencial"></div></div>';
    montarModuloPainelGerencial('container-painel-gerencial');
  }else if(pageId==='campanhas'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-campanhas"></div></div>';
    montarModuloCampanhas('container-campanhas');
  }else if(pageId==='tarefas'){
    el.innerHTML=roBanner+'<div class="crm-embed" id="container-tarefas"></div>';
    montarModuloTarefas('container-tarefas');
  }else if(pageId==='tutorial'){
    el.innerHTML=roBanner+'<div class="crm-embed"><div id="container-tutorial"></div></div>';
    montarModuloTutorial('container-tutorial');
  }else if(pageId==='canais'){
    el.innerHTML=roBanner+'<div class="crm-embed" id="container-canais"></div>';
    montarCanaisVenda('container-canais');
  }else if(pageId==='cvpage'){
    el.innerHTML=roBanner+'<div class="crm-embed" id="container-cvpage"></div>';
    montarCollabsVendedores('container-cvpage');
  }else if(pageId==='cfgfin'){
    el.innerHTML=roBanner+'<div class="crm-embed" id="container-cfgfin"></div>';
    montarConfigFinanceiro('container-cfgfin');
  }else if(pageId==='prest'||pageId==='upload'||pageId==='cardapios'){
    el.innerHTML=roBanner;
    var wrap=document.getElementById('financeiro-iframe-wrap');
    var frame=document.getElementById('financeiro-iframe');
    wrap.style.display='block';
    if(!frame.dataset.loaded){
      frame.src='/financeiro.html#'+pageId;
      frame.dataset.loaded='1';
      frame.dataset.currentPage=pageId;
    }else if(frame.dataset.currentPage!==pageId){
      try{
        frame.contentWindow.go(pageId);
        frame.dataset.currentPage=pageId;
      }catch(e){
        // Se por algum motivo não conseguir navegar internamente, recarrega (perde estado, mas não quebra)
        frame.src='/financeiro.html#'+pageId;
        frame.dataset.currentPage=pageId;
      }
    }
    return;
  }
}

    ST_TAR.tarefas=res[0];ST_TAR.clientes=res[1];ST_TAR.leads=res[2];ST_TAR.campanhas=res[3];ST_TAR.equipe=res[4];
  }catch(err){
    console.error(err);
    var msg=(err&&(err.message||err.details||err.hint))||'Erro desconhecido';
    host.querySelector('#tbl-tarefas').innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--rust,#c0392b);padding:20px">Erro ao carregar dados do Supabase:<br><b>'+msg+'</b></td></tr>';
    return;
  }

  var clientePorId={};ST_TAR.clientes.forEach(function(c){clientePorId[String(c.id)]=c;});
  var leadPorId={};ST_TAR.leads.forEach(function(l){leadPorId[l.id]=l;});
  var campanhaPorId={};ST_TAR.campanhas.forEach(function(c){campanhaPorId[c.id]=c;});
  var equipePorId={};ST_TAR.equipe.forEach(function(e){equipePorId[e.id]=e;});
  var clienteSelecionadoTarefa=null;
  function nomeUsuarioAtualTar(){return (window.cu&&window.cu.name)||'Usuário';}

  host.querySelector('#f-tar-resp').innerHTML='<option value="">Todos os responsáveis</option>'+
    ST_TAR.equipe.map(function(e){return '<option value="'+e.id+'">'+e.nome+'</option>';}).join('');
  host.querySelector('#f-tar-campanha').innerHTML='<option value="">Todas as campanhas</option>'+
    ST_TAR.campanhas.map(function(c){return '<option value="'+c.id+'">'+c.nome+'</option>';}).join('');
  host.querySelector('#tf-resp').innerHTML='<option value="">—</option>'+
    ST_TAR.equipe.map(function(e){return '<option value="'+e.id+'">'+e.nome+'</option>';}).join('');
  host.querySelector('#tf-lead').innerHTML='<option value="">—</option>'+
    ST_TAR.leads.slice().sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');}).map(function(l){
      var camp=campanhaPorId[l.campanhaId];
      return '<option value="'+l.id+'">'+(l.nome||'—')+(camp?' — '+camp.nome:'')+'</option>';
    }).join('');

  function statusTarefaReal(t){
    if(t.status==='concluida')return 'concluida';
    if(t.status==='cancelada')return 'cancelada';
    var hoje=new Date().toISOString().slice(0,10);
    if(t.dataPrevista&&t.dataPrevista<hoje)return 'atrasada';
    return t.status||'pendente';
  }
  var BADGE_MAP={pendente:'gd',em_andamento:'vio',concluida:'sage',atrasada:'rust',cancelada:'gd'};
  var LABEL_MAP={pendente:'Pendente',em_andamento:'Em Andamento',concluida:'Concluída',atrasada:'Atrasada',cancelada:'Cancelada'};
  var PRIOR_COR={baixa:'#6B7280',media:'#F59E0B',alta:'#c0392b'};
  function fmtDataTar(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}

  function getFiltroTar(){
    var fStatus=host.querySelector('#f-tar-status').value;
    var fResp=host.querySelector('#f-tar-resp').value;
    var fCampanha=host.querySelector('#f-tar-campanha').value;
    return ST_TAR.tarefas.filter(function(t){
      if(fStatus&&statusTarefaReal(t)!==fStatus)return false;
      if(fResp&&String(t.responsavelId)!==fResp)return false;
      if(fCampanha&&String(t.campanhaId)!==fCampanha)return false;
      return true;
    }).sort(function(a,b){return (a.dataPrevista||'9999').localeCompare(b.dataPrevista||'9999');});
  }

  function renderLista(){
    var list=getFiltroTar();
    host.querySelector('#tar-cnt').textContent=list.length.toLocaleString('pt-BR')+' tarefa(s)';
    var tb=host.querySelector('#tbl-tarefas');
    tb.innerHTML=list.map(function(t){
      var st=statusTarefaReal(t);
      var cliente=clientePorId[t.clienteId];
      var camp=campanhaPorId[t.campanhaId];
      var resp=equipePorId[t.responsavelId];
      return '<tr>'+
        '<td><b>'+t.descricao+'</b></td>'+
        '<td>'+(cliente?cliente.nome:'—')+'</td>'+
        '<td>'+(camp?'<span class="badge b-rust" style="font-size:8px">📣 '+camp.nome+'</span>':'—')+'</td>'+
        '<td>'+(resp?resp.nome:'—')+'</td>'+
        '<td><span class="tar-badge-prior" style="background:'+PRIOR_COR[t.prioridade||'media']+'">'+(t.prioridade||'media')+'</span></td>'+
        '<td>'+fmtDataTar(t.dataPrevista)+'</td>'+
        '<td><span class="badge b-'+BADGE_MAP[st]+'">'+LABEL_MAP[st]+'</span></td>'+
        '<td><button class="btn sm" data-editar-tar="'+t.id+'">✎</button> <button class="btn sm" data-excluir-tar="'+t.id+'">🗑</button></td>'+
        '</tr>';
    }).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--muted,#888);padding:20px">Nenhuma tarefa encontrada.</td></tr>';
    tb.querySelectorAll('[data-editar-tar]').forEach(function(b){b.addEventListener('click',function(){abrirModalTar(b.dataset.editarTar);});});
    tb.querySelectorAll('[data-excluir-tar]').forEach(function(b){b.addEventListener('click',function(){excluirTarefa(b.dataset.excluirTar);});});
  }

  function renderRoadmap(){
    var list=getFiltroTar();
    var grupos={};
    list.forEach(function(t){
      var chave=t.campanhaId?String(t.campanhaId):'__sem_campanha__';
      if(!grupos[chave])grupos[chave]=[];
      grupos[chave].push(t);
    });
    var chaves=Object.keys(grupos).sort(function(a,b){return a==='__sem_campanha__'?1:(b==='__sem_campanha__'?-1:0);});
    var box=host.querySelector('#tar-roadmap-wrap');
    box.innerHTML=chaves.length?chaves.map(function(chave){
      var tarefas=grupos[chave];
      var camp=chave!=='__sem_campanha__'?campanhaPorId[chave]:null;
      var concluidas=tarefas.filter(function(t){return t.status==='concluida';}).length;
      var pct=Math.round((concluidas/tarefas.length)*100);
      return '<div class="tar-roadmap-grupo">'+
        '<div class="tar-roadmap-h"><b>'+(camp?'📣 '+camp.nome:'Sem campanha vinculada')+'</b><span class="pct">'+concluidas+' de '+tarefas.length+' concluídas ('+pct+'%)</span></div>'+
        tarefas.map(function(t){
          var st=statusTarefaReal(t);
          var cliente=clientePorId[t.clienteId];
          var resp=equipePorId[t.responsavelId];
          return '<div class="tar-item"><span><b>'+t.descricao+'</b>'+(cliente?' — '+cliente.nome:'')+(resp?' · '+resp.nome:'')+'</span>'+
            '<span><span class="badge b-'+BADGE_MAP[st]+'">'+LABEL_MAP[st]+'</span> '+fmtDataTar(t.dataPrevista)+'</span></div>';
        }).join('')+
      '</div>';
    }).join('') : '<p class="tmu">Nenhuma tarefa encontrada.</p>';
  }

  function render(){
    if(ST_TAR.visao==='lista'){renderLista();}else{renderRoadmap();}
  }

  host.querySelector('#tar-btn-visao').addEventListener('click',function(){
    ST_TAR.visao=ST_TAR.visao==='lista'?'roadmap':'lista';
    host.querySelector('#tar-lista-wrap').style.display=ST_TAR.visao==='lista'?'':'none';
    host.querySelector('#tar-roadmap-wrap').style.display=ST_TAR.visao==='roadmap'?'':'none';
    this.textContent=ST_TAR.visao==='lista'?'🗺 Ver por Campanha':'📋 Ver Lista';
    render();
  });

  var modalTar=host.querySelector('#modal-tarefa');
  function buscarClientesTar(termo){
    var t=termo.trim().toLowerCase();
    if(t.length<3)return [];
    return ST_TAR.clientes.filter(function(c){return c.nome&&c.nome.toLowerCase().indexOf(t)!==-1;}).slice(0,8);
  }
  function vincularClienteTar(cliente){
    clienteSelecionadoTarefa=cliente;
    host.querySelector('#tf-busca-cliente').style.display='none';
    host.querySelector('#tf-busca-resultados').style.display='none';
    host.querySelector('#tf-cliente-vinculado').innerHTML='🔗 <b>'+cliente.nome+'</b> <button class="btn sm" id="tf-trocar-cliente" type="button">Trocar</button>';
    host.querySelector('#tf-trocar-cliente').addEventListener('click',function(){
      clienteSelecionadoTarefa=null;
      host.querySelector('#tf-busca-cliente').style.display='';
      host.querySelector('#tf-busca-cliente').value='';
      host.querySelector('#tf-cliente-vinculado').innerHTML='';
    });
  }
  host.querySelector('#tf-busca-cliente').addEventListener('input',function(){
    var resultados=buscarClientesTar(this.value);
    var box=host.querySelector('#tf-busca-resultados');
    if(!resultados.length){box.style.display='none';return;}
    box.innerHTML=resultados.map(function(c){return '<div class="tar-busca-item" data-id="'+c.id+'"><b>'+c.nome+'</b><br><span style="color:var(--muted,#888)">'+(c.email||c['telefone-celular']||'')+'</span></div>';}).join('');
    box.style.display='';
    box.querySelectorAll('.tar-busca-item').forEach(function(item){
      item.addEventListener('click',function(){var c=clientePorId[item.dataset.id];if(c)vincularClienteTar(c);});
    });
  });
  host.querySelector('#tf-lead').addEventListener('change',function(){
    var lead=leadPorId[this.value];
    if(lead&&lead.clienteId){
      var c=clientePorId[lead.clienteId];
      if(c)vincularClienteTar(c);
    }
  });

  function abrirModalTar(id){
    ST_TAR.editId=id||null;
    var t=id?ST_TAR.tarefas.find(function(x){return String(x.id)===String(id);}):null;
    host.querySelector('#mo-tar-title').textContent=id?'Editar Tarefa':'Nova Tarefa';
    host.querySelector('#tf-desc').value=t?t.descricao:'';
    host.querySelector('#tf-sugerida-wrap').style.display=(t&&t.descricaoSugerida)?'':'none';
    host.querySelector('#tf-desc-sugerida').textContent=(t&&t.descricaoSugerida)?t.descricaoSugerida:'';
    host.querySelector('#tf-lead').value=t?(t.leadId||''):'';
    host.querySelector('#tf-tipo').value=t?t.tipo:'ligacao';
    host.querySelector('#tf-resp').value=t?(t.responsavelId||''):'';
    host.querySelector('#tf-prioridade').value=t?(t.prioridade||'media'):'media';
    host.querySelector('#tf-status').value=t?t.status:'pendente';
    host.querySelector('#tf-inicio').value=t?(t.dataInicio||''):new Date().toISOString().slice(0,10);
    host.querySelector('#tf-prevista').value=t?(t.dataPrevista||''):'';
    host.querySelector('#tf-conclusao').value=t?(t.dataConclusao||''):'';
    host.querySelector('#tf-resultado').value=t?(t.resultado||''):'';
    clienteSelecionadoTarefa=null;
    host.querySelector('#tf-busca-cliente').style.display='';
    host.querySelector('#tf-busca-cliente').value='';
    host.querySelector('#tf-busca-resultados').style.display='none';
    host.querySelector('#tf-cliente-vinculado').innerHTML='';
    if(t&&t.clienteId){
      var c=clientePorId[t.clienteId];
      if(c)vincularClienteTar(c);
    }
    host.querySelector('#tar-m-excluir').style.display=id?'inline-block':'none';
    modalTar.classList.add('op');
  }
  function fecharModalTar(){modalTar.classList.remove('op');}

  async function salvarTarefa(){
    var descricao=host.querySelector('#tf-desc').value.trim();
    if(!descricao){alert('Informe a descrição da tarefa.');return;}
    var leadId=host.querySelector('#tf-lead').value||null;
    var lead=leadId?leadPorId[leadId]:null;
    var o={
      id:ST_TAR.editId||undefined, descricao:descricao, leadId:leadId,
      clienteId:clienteSelecionadoTarefa?String(clienteSelecionadoTarefa.id):(lead?lead.clienteId:null),
      campanhaId:lead?lead.campanhaId:null,
      responsavelId:host.querySelector('#tf-resp').value||null,
      tipo:host.querySelector('#tf-tipo').value, prioridade:host.querySelector('#tf-prioridade').value,
      status:host.querySelector('#tf-status').value,
      dataInicio:host.querySelector('#tf-inicio').value||null, dataPrevista:host.querySelector('#tf-prevista').value||null,
      dataConclusao:host.querySelector('#tf-conclusao').value||null, resultado:host.querySelector('#tf-resultado').value.trim(),
      criadoPor:nomeUsuarioAtualTar()
    };
    try{
      var salvo=await cdaSalvarTarefa(o);
      if(ST_TAR.editId){
        var idx=ST_TAR.tarefas.findIndex(function(x){return String(x.id)===String(ST_TAR.editId);});
        ST_TAR.tarefas[idx]=salvo;
      }else{
        ST_TAR.tarefas.push(salvo);
      }
      fecharModalTar();render();
    }catch(err){
      console.error(err);
      alert('Erro ao salvar:\n'+((err&&(err.message||err.details||err.hint))||'Erro desconhecido'));
    }
  }
  async function excluirTarefa(id){
    if(!confirm('Excluir esta tarefa?'))return;
    try{
      await cdaExcluirTarefa(id);
      ST_TAR.tarefas=ST_TAR.tarefas.filter(function(x){return String(x.id)!==String(id);});
      render();
    }catch(err){
      console.error(err);
      alert('Erro ao excluir:\n'+((err&&(err.message||err.details||err.hint))||'Erro desconhecido'));
    }
  }

  host.querySelector('#tar-btn-novo').addEventListener('click',function(){abrirModalTar(null);});
  host.querySelector('#tf-copiar-sugerida').addEventListener('click',function(){
    var sugerida=host.querySelector('#tf-desc-sugerida').textContent;
    if(!sugerida)return;
    host.querySelector('#tf-desc').value=sugerida;
  });
  host.querySelector('#tar-modal-x').addEventListener('click',fecharModalTar);
  host.querySelector('#tar-m-cancelar').addEventListener('click',fecharModalTar);
  host.querySelector('#tar-m-salvar').addEventListener('click',salvarTarefa);
  host.querySelector('#tar-m-excluir').addEventListener('click',function(){excluirTarefa(ST_TAR.editId);fecharModalTar();});
  host.querySelector('#f-tar-status').addEventListener('change',render);
  host.querySelector('#f-tar-resp').addEventListener('change',render);
  host.querySelector('#f-tar-campanha').addEventListener('change',render);
  render();
}

// ── CONFIG FINANCEIRO — Tipos de Peça e Coleções (Supabase) ─────────
async function montarConfigFinanceiro(containerId){
  var host=document.getElementById(containerId);
  var tipos=[],colecoes=[];
  try{
    tipos=await cdaCarregarTiposProduto();
    colecoes=await cdaCarregarColecoes();
  }catch(e){ host.innerHTML='<p style="color:var(--rust)">Erro ao carregar dados. Veja o console.</p>'; console.error(e); return; }
  function render(){
    host.innerHTML=
      '<div class="sec-t">Tipos e Coleções</div><div class="sec-d">Listas usadas no cadastro de produtos</div>'+
      '<div class="cc"><h3>Tipos de Peça</h3><div id="tp-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">'+
      tipos.map(function(t){return '<span class="badge b-vio" style="padding:4px 11px;font-size:10px;cursor:pointer" data-rmtp="'+t+'">'+t+' ✕</span>';}).join('')+
      '</div><div style="display:flex;gap:7px;"><input type="text" id="new-tp" placeholder="Ex: Moletom" style="font-family:\'Syne\',sans-serif;font-size:12px;padding:6px 11px;border:2px solid var(--ink);flex:1;outline:none;"><button class="btn rust sm" id="btn-add-tp">+ Adicionar</button></div></div>'+
      '<div class="cc"><h3>Coleções</h3><div id="col-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">'+
      colecoes.map(function(c){return '<span class="badge b-gd" style="padding:4px 11px;font-size:10px;cursor:pointer" data-rmcol="'+c+'">'+c+' ✕</span>';}).join('')+
      '</div><div style="display:flex;gap:7px;"><input type="text" id="new-col" placeholder="Ex: Tour 2026" style="font-family:\'Syne\',sans-serif;font-size:12px;padding:6px 11px;border:2px solid var(--ink);flex:1;outline:none;"><button class="btn rust sm" id="btn-add-col">+ Adicionar</button></div></div>';
    host.querySelectorAll('[data-rmtp]').forEach(function(el){el.addEventListener('click',async function(){
      if(!confirm('Remover o tipo "'+el.dataset.rmtp+'"?'))return;
      try{await cdaExcluirTipoProduto(el.dataset.rmtp);tipos=tipos.filter(function(t){return t!==el.dataset.rmtp;});render();}catch(e){alert('Erro ao remover.');console.error(e);}
    });});
    host.querySelectorAll('[data-rmcol]').forEach(function(el){el.addEventListener('click',async function(){
      if(!confirm('Remover a coleção "'+el.dataset.rmcol+'"?'))return;
      try{await cdaExcluirColecao(el.dataset.rmcol);colecoes=colecoes.filter(function(c){return c!==el.dataset.rmcol;});render();}catch(e){alert('Erro ao remover.');console.error(e);}
    });});
    host.querySelector('#btn-add-tp').addEventListener('click',async function(){
      var v=host.querySelector('#new-tp').value.trim();if(!v||tipos.includes(v))return;
      try{await cdaAdicionarTipoProduto(v);tipos.push(v);render();}catch(e){alert('Erro ao adicionar.');console.error(e);}
    });
    host.querySelector('#btn-add-col').addEventListener('click',async function(){
      var v=host.querySelector('#new-col').value.trim();if(!v||colecoes.includes(v))return;
      try{await cdaAdicionarColecao(v);colecoes.push(v);render();}catch(e){alert('Erro ao adicionar.');console.error(e);}
    });
  }
  render();
}

// ── COLLABS / VENDEDORES (parceiros) — Supabase ─────────────────────
async function montarCollabsVendedores(containerId){
  var host=document.getElementById(containerId);
  var parceiros=[],canais=[];
  try{
    parceiros=await cdaCarregarParceiros();
    canais=await cdaCarregarCanais();
  }catch(e){ host.innerHTML='<p style="color:var(--rust)">Erro ao carregar dados. Veja o console.</p>'; console.error(e); return; }
  host.innerHTML=
    '<div class="row-bt"><div><div class="sec-t">Collabs / Vendedores</div><div class="sec-d">Artistas e parceiros vinculados à Ciclo da Arte</div></div>'+
    '<button class="btn rust sm" id="cv-btn-novo">+ Novo</button></div>'+
    '<div class="fb"><input type="text" id="f-cvnome" placeholder="Buscar collab / vendedor...">'+
    '<select id="f-cv-canal"><option value="">Todos os canais</option>'+canais.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);}).map(function(c){return '<option value="'+c.id+'">'+c.nome+'</option>';}).join('')+'</select>'+
    '<span class="fc" id="cv-cnt"></span></div>'+
    '<div class="cc-g" id="cv-cards" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;"></div>'+
    '<div class="mo" id="mo-cv"><div class="mo-box"><div class="mo-h"><h3 id="mo-cv-t">Novo Collab / Vendedor</h3><button class="mo-x" id="cv-modal-x">✕</button></div>'+
    '<div class="mo-b"><div class="fg"><div class="fgr" style="grid-column:1/-1"><label>Nome *</label><input id="cv-nome" type="text" placeholder="Ex: Duda Beat"></div>'+
    '<div class="fgr" style="grid-column:1/-1"><label>Observações</label><textarea id="cv-obs"></textarea></div></div></div>'+
    '<div class="mo-f"><button class="btn" id="cv-m-cancelar">Cancelar</button><button class="btn rust" id="cv-m-salvar">Salvar</button></div></div></div>';

  function render(){
    var busca=host.querySelector('#f-cvnome').value.toLowerCase();
    var fCanal=host.querySelector('#f-cv-canal').value;
    var list=parceiros.filter(function(p){
      if(busca&&!(p.nome||'').toLowerCase().includes(busca))return false;
      if(fCanal&&!canais.some(function(c){return String(c.parceiroId)===String(p.id)&&String(c.id)===fCanal;}))return false;
      return true;
    });
    host.querySelector('#cv-cnt').textContent=list.length+' collab(s)/vendedor(es)';
    host.querySelector('#cv-cards').innerHTML=list.map(function(p){
      var qtdCanais=canais.filter(function(c){return String(c.parceiroId)===String(p.id);}).length;
      return '<div class="ccard"><div class="ccard-n">'+p.nome+'</div><div class="ccard-t">'+qtdCanais+' canal(is)</div>'+
        '<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm" data-edit="'+p.id+'">✏</button>'+
        '<button class="btn sm" style="background:var(--rust);color:#fff" data-del="'+p.id+'">🗑</button></div></div>';
    }).join('')||'<p class="tmu" style="grid-column:1/-1">Nenhum collab/vendedor encontrado.</p>';
    host.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){abrirModal(b.dataset.edit);});});
    host.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',function(){excluir(b.dataset.del);});});
  }
  var modal=host.querySelector('#mo-cv');
  function abrirModal(id){
    var p=id?parceiros.find(function(x){return String(x.id)===String(id);}):null;
    host.querySelector('#mo-cv-t').textContent=id?'Editar Collab / Vendedor':'Novo Collab / Vendedor';
    host.querySelector('#cv-nome').value=p?p.nome:'';
    host.querySelector('#cv-obs').value=p?(p.obs||''):'';
    modal.dataset.editId=id||'';
    modal.classList.add('op');
  }
  function fecharModal(){modal.classList.remove('op');}
  host.querySelector('#cv-btn-novo').addEventListener('click',function(){abrirModal(null);});
  host.querySelector('#cv-modal-x').addEventListener('click',fecharModal);
  host.querySelector('#cv-m-cancelar').addEventListener('click',fecharModal);
  host.querySelector('#cv-m-salvar').addEventListener('click',async function(){
    var nome=host.querySelector('#cv-nome').value.trim();
    if(!nome){alert('Nome obrigatório.');return;}
    var editId=modal.dataset.editId;
    try{
      var salvo=await cdaSalvarParceiro({id:editId||null,nome:nome,obs:host.querySelector('#cv-obs').value});
      if(editId){var i=parceiros.findIndex(function(x){return String(x.id)===String(editId);});parceiros[i]=salvo;}
      else parceiros.push(salvo);
      fecharModal();render();
    }catch(e){alert('Erro ao salvar.');console.error(e);}
  });
  async function excluir(id){
    var nome=(parceiros.find(function(x){return String(x.id)===String(id);})||{}).nome||'';
    if(!confirm('Deletar o Collab/Vendedor "'+nome+'"?\nEsta ação não pode ser desfeita.'))return;
    var canaisVinc=canais.filter(function(c){return String(c.parceiroId)===String(id);});
    if(canaisVinc.length>0){alert('Não é possível deletar: este Collab/Vendedor possui '+canaisVinc.length+' canal(is) de venda vinculado(s).');return;}
    try{
      await cdaExcluirParceiro(id);
      parceiros=parceiros.filter(function(x){return String(x.id)!==String(id);});
      render();
    }catch(e){alert('Erro ao excluir.');console.error(e);}
  }
  host.querySelector('#f-cvnome').addEventListener('input',render);
  host.querySelector('#f-cv-canal').addEventListener('change',render);
  render();
}

    '<select id="f-col-tipo"><option value="">Todos os tipos</option><option value="artista">Artista</option><option value="casa_shows">Casa de Shows</option><option value="revenda">Revenda</option><option value="ecommerce">E-Commerce Dedicado</option><option value="multi">E-Commerce Multimarcas</option></select>'+
    '<span class="fc" id="col-cnt"></span></div>'+
    '<div class="kpi-g" style="margin-bottom:16px">'+
    '<div class="kpi"><div class="kpi-l">Total Canais</div><div class="kpi-v" id="col-total-kpi">—</div><div class="kpi-s">conforme filtros</div></div>'+
    '<div class="kpi gd"><div class="kpi-l">Artistas</div><div class="kpi-v" id="col-kpi-artista">—</div><div class="kpi-s">canais tipo artista</div></div>'+
    '<div class="kpi vi"><div class="kpi-l">E-Commerce</div><div class="kpi-v" id="col-kpi-ecommerce">—</div><div class="kpi-s">canais e-commerce</div></div>'+
    '<div class="kpi sa"><div class="kpi-l">Revendas</div><div class="kpi-v" id="col-kpi-revenda">—</div><div class="kpi-s">canais revenda</div></div>'+
    '<div class="kpi li"><div class="kpi-l">Shows / Outros</div><div class="kpi-v" id="col-kpi-outros">—</div><div class="kpi-s">demais tipos</div></div></div>'+
    '<div class="cc-g" id="col-cards"></div>'+
    '<div class="mo" id="mo-col"><div class="mo-box"><div class="mo-h"><h3 id="mo-col-t">Novo Canal de Venda</h3><button class="mo-x" id="col-modal-x">✕</button></div>'+
    '<div class="mo-b"><div class="fg">'+
    '<div class="fgr"><label>Collab / Vendedor</label><select id="col-cv"><option value="">— Selecione —</option></select></div>'+
    '<div class="fgr"><label>Tipo</label><select id="col-t"><option value="artista">Artista</option><option value="casa_shows">Casa de Shows</option><option value="revenda">Revenda</option><option value="ecommerce">E-Commerce Dedicado</option><option value="multi">E-Commerce Multimarcas</option></select></div>'+

  function render(){
    var busca=host.querySelector('#f-col-nome').value.toLowerCase();
    var fCv=host.querySelector('#f-col-cv').value;
    var fTipo=host.querySelector('#f-col-tipo').value;
    var list=canais.filter(function(c){
      if(busca&&!(c.nome||'').toLowerCase().includes(busca))return false;
      if(fCv&&String(c.parceiroId)!==fCv)return false;
      if(fTipo&&c.tipo!==fTipo)return false;
      return true;
    });
    host.querySelector('#col-cnt').textContent=list.length+' canal(is)';
    host.querySelector('#col-total-kpi').textContent=list.length;
    host.querySelector('#col-kpi-artista').textContent=list.filter(function(c){return c.tipo==='artista';}).length;
    host.querySelector('#col-kpi-ecommerce').textContent=list.filter(function(c){return c.tipo==='ecommerce'||c.tipo==='multi';}).length;
    host.querySelector('#col-kpi-revenda').textContent=list.filter(function(c){return c.tipo==='revenda';}).length;
    host.querySelector('#col-kpi-outros').textContent=list.filter(function(c){return c.tipo!=='artista'&&c.tipo!=='ecommerce'&&c.tipo!=='multi'&&c.tipo!=='revenda';}).length;
    host.querySelector('#col-cards').innerHTML=list.map(function(c){
      var parc=parceiros.find(function(p){return String(p.id)===String(c.parceiroId);});
      var cls=TIPO_C_CANAL[c.tipo]||'';
      return '<div class="ccard '+cls+'"><div class="ccard-n">'+c.nome+'</div><div class="ccard-t">'+(TIPO_L_CANAL[c.tipo]||c.tipo)+(parc?' · '+parc.nome:'')+'</div>'+

    host.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',function(){excluir(b.dataset.del,b.dataset.nome);});});
  }
  var modal=host.querySelector('#mo-col');
  function abrirModal(id){
    var c=id?canais.find(function(x){return String(x.id)===String(id);}):null;
    host.querySelector('#mo-col-t').textContent=c?'Editar Canal de Venda':'Novo Canal de Venda';
    var selCv=host.querySelector('#col-cv');
    selCv.innerHTML='<option value="">— Selecione —</option>'+parceiros.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);}).map(function(p){return '<option value="'+p.id+'">'+p.nome+'</option>';}).join('');
    selCv.value=c?(c.parceiroId||''):'';
    host.querySelector('#col-n').value=c?c.nome:'';
    host.querySelector('#col-t').value=c?(c.tipo||'artista'):'artista';
    host.querySelector('#col-c').value=c&&c.comissao!=null?c.comissao:'';
    host.querySelector('#col-imp').value=c&&c.pctImp!=null?c.pctImp:'';
    host.querySelector('#col-op').value=c&&c.pctOp!=null?c.pctOp:'';
    host.querySelector('#col-cs').value=c&&c.pctCs!=null?c.pctCs:'';
    host.querySelector('#col-frete-flag').checked=c?!!c.semFrete:false;
    host.querySelector('#col-e').value=c?(c.email||''):'';
    host.querySelector('#col-o').value=c?(c.obs||''):'';
    modal.dataset.editId=id||'';
    modal.classList.add('op');
  }
  function fecharModal(){modal.classList.remove('op');}
  host.querySelector('#col-btn-novo').addEventListener('click',function(){abrirModal(null);});
  host.querySelector('#col-modal-x').addEventListener('click',fecharModal);
  host.querySelector('#col-m-cancelar').addEventListener('click',fecharModal);
  host.querySelector('#col-m-salvar').addEventListener('click',async function(){
    var nome=host.querySelector('#col-n').value.trim();
    if(!nome){alert('Nome obrigatório.');return;}
    var editId=modal.dataset.editId;
    var com=parseFloat(host.querySelector('#col-c').value);
    var pctImp=parseFloat(host.querySelector('#col-imp').value);
    var pctOp=parseFloat(host.querySelector('#col-op').value);
    var pctCs=parseFloat(host.querySelector('#col-cs').value);
    var o={id:editId||null,nome:nome,tipo:host.querySelector('#col-t').value,comissao:isNaN(com)?null:com,
      pctImp:isNaN(pctImp)?null:pctImp,pctOp:isNaN(pctOp)?null:pctOp,pctCs:isNaN(pctCs)?null:pctCs,
      semFrete:host.querySelector('#col-frete-flag').checked,email:host.querySelector('#col-e').value,
      obs:host.querySelector('#col-o').value,parceiroId:host.querySelector('#col-cv').value||null};
    try{
      var salvo=await cdaSalvarCanal(o);
      if(editId){var i=canais.findIndex(function(x){return String(x.id)===String(editId);});canais[i]=salvo;}
      else canais.push(salvo);
      fecharModal();render();
    }catch(e){alert('Erro ao salvar.');console.error(e);}
  });
  async function excluir(id,nome){
    if(!confirm('Deletar canal "'+nome+'"?\nEsta ação não pode ser desfeita.'))return;
    try{
      await cdaExcluirCanal(id);
      canais=canais.filter(function(x){return String(x.id)!==String(id);});
      render();
    }catch(e){
      alert('Não foi possível excluir. Pode haver histórico de compras ou prestações vinculadas a este canal.');
      console.error(e);
    }
  }
  host.querySelector('#f-col-nome').addEventListener('input',render);
  host.querySelector('#f-col-cv').addEventListener('change',render);
  host.querySelector('#f-col-tipo').addEventListener('change',render);
  render();
}

function validateCredForm(d,excludeId){
  if(!d.name){showToast('Nome é obrigatório','error');return false;}
  if(d.email||d.pass){
    if(!d.email||!d.email.includes('@')){showToast('E-mail inválido (ou deixe e-mail e senha em branco pra cadastrar sem login)','error');return false;}
    if(!d.pass||d.pass.length<4){showToast('Senha mínima: 4 caracteres (ou deixe e-mail e senha em branco pra cadastrar sem login)','error');return false;}
  }
  if(d.email&&EQUIPE.find(function(u){return u.email===d.email&&u.id!==excludeId;})){showToast('E-mail já cadastrado','error');return false;}
  if(!d.is_admin&&!d.projetos.length){showToast('Selecione ao menos um projeto','error');return false;}
  return true;
}
var CDA_CATALOGO_PERM_CACHE=null;
async function carregarCatalogoPermissoes(){
  if(CDA_CATALOGO_PERM_CACHE)return CDA_CATALOGO_PERM_CACHE;
  var {data,error}=await cdaClient.from('cda_permissoes_catalogo').select('*').order('projeto').order('ordem');
  if(error){console.error(error);return [];}
  CDA_CATALOGO_PERM_CACHE=data;
  return data;
}
async function carregarPermissoesUsuario(equipeId){
  if(!equipeId)return [];
  var {data,error}=await cdaClient.from('cda_equipe_permissoes').select('*').eq('equipe_id',equipeId);
  if(error){console.error(error);return [];}
  return data;
}
function renderPermissoesSubmodulo(catalogo,permissoesExistentes,projetosSelecionados,permissaoGeral){
  var porUsuario={};(permissoesExistentes||[]).forEach(function(p){porUsuario[p.submodulo_id]=p.nivel;});
  var porProjeto={};catalogo.forEach(function(s){(porProjeto[s.projeto]=porProjeto[s.projeto]||[]).push(s);});
  return Object.keys(porProjeto).map(function(proj){
    var visivel=(projetosSelecionados||[]).indexOf(proj)>=0;
    var itens=porProjeto[proj].map(function(s){
      var nivelAtual=porUsuario.hasOwnProperty(s.id)?porUsuario[s.id]:(permissaoGeral||'leitura_escrita');
      return '<div style="display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px">'+
        '<span style="flex:1">'+s.submodulo_label+'</span>'+
        '<select class="cred-sub-nivel" data-sub="'+s.id+'" style="font-size:11px;padding:3px 6px">'+
          '<option value="desabilitado"'+(nivelAtual==='desabilitado'?' selected':'')+'>Desabilitado</option>'+
          '<option value="leitura"'+(nivelAtual==='leitura'?' selected':'')+'>Leitura</option>'+
          '<option value="leitura_escrita"'+(nivelAtual==='leitura_escrita'?' selected':'')+'>Leitura e Gravação</option>'+
        '</select></div>';
    }).join('');
    return '<div class="cred-sub-grupo" data-projeto="'+proj+'" style="display:'+(visivel?'block':'none')+';margin-bottom:10px;padding:8px 10px;background:rgba(255,255,255,.03);border-radius:8px">'+
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);margin-bottom:4px">'+(PROJETOS[proj]?PROJETOS[proj].icon+' '+PROJETOS[proj].label:proj)+'</div>'+
      itens+'</div>';
  }).join('');
}
async function openModalCred(id){
  var u=id?EQUIPE.find(function(x){return x.id===id;}):null;
  var catalogo=await carregarCatalogoPermissoes();
  var permissoesExistentes=await carregarPermissoesUsuario(id);
  openModal('<div class="modal-box" onclick="event.stopPropagation()"><div class="modal-title"><div class="cdot red"></div>'+(u?'Editar':'Novo')+' Usuário</div>'+credForm(u,catalogo,permissoesExistentes)+'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="'+(u?'saveCredEdit('+id+')':'saveCredAdd()')+'">Salvar</button></div></div>');
  document.querySelectorAll('.cred-proj-chk').forEach(function(chk){
    chk.addEventListener('change',function(){
      var selecionados=Array.from(document.querySelectorAll('.cred-proj-chk:checked')).map(function(el){return el.value;});
      document.querySelectorAll('.cred-sub-grupo').forEach(function(grupo){
        grupo.style.display=selecionados.indexOf(grupo.dataset.projeto)>=0?'block':'none';

  });
}

async function sincronizarPermissoesSubmodulo(equipeId){
  var itens=getPermissoesSubmoduloData();
  await cdaClient.from('cda_equipe_permissoes').delete().eq('equipe_id',equipeId);
  if(itens.length){

<script>
// ── EXPORTAR EXCEL via Supabase Edge Function ─────────────────────
async function exportarExcel(){
showToast('Gerando planilha...','info');
try{
var response=await fetch(EDGE_URL,{
method:'GET',
headers:{'Authorization':'Bearer '+SUPABASE_KEY,'apikey':SUPABASE_KEY}
});
if(!response.ok)throw new Error('Erro ao gerar planilha: '+response.status);
var blob=await response.blob();
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download='ciclo_da_arte_tarefas.xlsx';
a.style.display='none';
document.body.appendChild(a);a.click();
setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a);},100);
showToast('Planilha baixada com sucesso!','success');
}catch(e){showToast('Erro: '+e.message,'error');}
}
// ── IMPORTAR EXCEL ───────────────────────────────────────────────
function abrirImportacao(){document.getElementById('file-input').click();}
function handleFileImport(input){
var file=input.files[0];if(!file)return;
var reader=new FileReader();
reader.onload=function(e){
try{
var data=new Uint8Array(e.target.result);
var wb=XLSX.read(data,{type:'array'});
var ws=wb.Sheets[wb.SheetNames[0]];
var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
if(rows.length<2){showToast('Planilha vazia ou inválida','error');return;}
var dataRows=rows.slice(1).filter(function(r){return r[3]&&String(r[3]).trim();});
if(!dataRows.length){showToast('Nenhuma tarefa encontrada','error');return;}
openModalImportPreview(dataRows);
}catch(err){showToast('Erro ao ler o arquivo: '+err.message,'error');}
};
reader.readAsArrayBuffer(file);input.value='';
}
function openModalImportPreview(rows){
var preview=rows.slice(0,5).map(function(r){
return'<tr><td>'+r[0]+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+r[1]+'</td><td>'+r[2]+'</td><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+r[3]+'</td><td>'+r[10]+'</td></tr>';
}).join('');
openModal('<div class="modal-box" onclick="event.stopPropagation()" style="width:600px">'
+'<div class="modal-title"><div class="cdot blue"></div>Importar Planilha</div>'
+'<div class="rec-box" style="margin-bottom:16px"><div class="rec-title">📋 Prévia da importação</div><p>'+rows.length+' tarefas encontradas. As tarefas serão atualizadas conforme os dados da planilha.</p></div>'
+'<div class="import-preview"><table><thead><tr><th>Fase</th><th>Atividade</th><th>Nº</th><th>Tarefa</th><th>Status</th></tr></thead><tbody>'+preview+'</tbody></table>'
+(rows.length>5?'<p style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">... e mais '+(rows.length-5)+' tarefas</p>':'')
+'</div>'
+'<div id="import-progress" style="display:none"><div style="font-size:12px;color:var(--muted);margin-top:12px" id="import-status">Importando...</div><div class="progress-bar"><div class="progress-fill" id="import-bar" style="width:0%"></div></div></div>'
+'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="btn-confirmar-import">Confirmar Importação</button></div>'
+'</div>');
window._importRows=rows;
document.getElementById('btn-confirmar-import').onclick=function(){confirmarImport(window._importRows);};
}
async function confirmarImport(rows){
document.getElementById('btn-confirmar-import').disabled=true;
document.getElementById('btn-confirmar-import').textContent='Importando...';
document.getElementById('import-progress').style.display='block';
var total=rows.length;var done=0;var erros=0;
for(var i=0;i<rows.length;i++){
var r=rows[i];
var nomeFase=String(r[1]||'').trim();
var numTarefa=parseInt(r[2])||0;
var nomeTarefa=String(r[3]||'').trim();
if(!nomeTarefa)continue;
var acao=ACOES.find(function(a){return a.title.trim().toLowerCase()===nomeFase.toLowerCase();});
if(!acao){erros++;done++;continue;}
var tarefasAcao=TAREFAS.filter(function(t){return t.acao_id===acao.id;});
var tarefa=tarefasAcao[numTarefa-1]||tarefasAcao.find(function(t){return t.titulo.trim().toLowerCase()===nomeTarefa.toLowerCase();});
var payload={titulo:nomeTarefa,data_inicio:parseDate(r[4])||null,data_fim:parseDate(r[5])||null,data_realizada:parseDate(r[6])||null,responsavel1:String(r[7]||'').trim(),responsavel2:String(r[8]||'').trim()||null,observacao:String(r[9]||'').trim()||null,status:statusNorm(r[10])};
try{
if(tarefa){await sb.patch('tarefas',tarefa.id,payload);var idx=TAREFAS.findIndex(function(t){return t.id===tarefa.id;});Object.assign(TAREFAS[idx],payload);}
else{payload.acao_id=acao.id;var res=await sb.post('tarefas',payload);if(res&&res[0])TAREFAS.push(res[0]);}
}catch(e){erros++;}
done++;
var pct=Math.round((done/total)*100);
document.getElementById('import-bar').style.width=pct+'%';
document.getElementById('import-status').textContent='Importando... '+done+'/'+total;
}
closeModal();filterAcoes(acoesFilter);
if(erros>0){showToast('Concluído com '+erros+' linha(s) não encontrada(s)','info');}
else{showToast('Importação concluída! '+done+' tarefas atualizadas.','success');}
}

var done=ACOES.filter(function(a){return a.status==='done';}).length;
var active=ACOES.filter(function(a){return a.status==='active';}).length;
var tDone=TAREFAS.filter(function(t){return t.status==='done';}).length;
el.innerHTML='<div class="ph"><h1>Olá, '+cu.name.split(' ')[0]+' 👋</h1><p>'+(RC[cu.role]?RC[cu.role].label:cu.role)+' — visão geral</p></div>'
+'<div class="kpi-strip">'
+'<div class="kpi-card c-red"><div class="kpi-label">Faturamento Total</div><div class="kpi-value">R$ 92,5k</div><div class="kpi-sub">Mensal estimado</div><div class="kpi-badge warn">Meta: R$ 160k/mês</div></div>'
+'<div class="kpi-card c-gold"><div class="kpi-label">Conversão Site</div><div class="kpi-value">0,80%</div><div class="kpi-sub">Meta: 1,5%</div><div class="kpi-badge down">▼ 47% abaixo</div></div>'
+'<div class="kpi-card c-teal"><div class="kpi-label">Ações Concluídas</div><div class="kpi-value">'+done+'/'+ACOES.length+'</div><div class="kpi-sub">'+active+' em andamento</div><div class="kpi-badge up">'+tDone+' tarefas feitas</div></div>'
+'<div class="kpi-card c-purple"><div class="kpi-label">ROAS Atual</div><div class="kpi-value">3,2x</div><div class="kpi-sub">Meta: 3,5x – 5,0x</div><div class="kpi-badge warn">▲ Em progresso</div></div>'
+'</div>'

+'<div class="card"><div class="card-title"><div class="cdot gold"></div>Progresso por Módulo</div>'
+MODULOS.map(function(m){return'<div class="prog-item"><div class="prog-head"><span>M0'+m.id+' — '+m.name+'</span><span>'+m.pct+'%</span></div><div class="prog-track"><div class="prog-fill '+m.color+'" style="width:'+m.pct+'%"></div></div></div>';}).join('')+'</div></div>'
+'<div class="card"><div class="card-title"><div class="cdot teal"></div>Próximas Ações Prioritárias</div>'
+ACOES.filter(function(a){return a.status!=='done'&&a.prioridade==='alta';}).slice(0,5).map(function(a){return actionRow(a,false);}).join('')+'</div>';

// ── ROADMAP ──────────────────────────────────────────────────────
function renderRoadmap(el){
var months=['Mai','Jun','Jul','Ago','Set','Out','Nov','Dez','Jan','Fev','Mar','Abr'];
var phases=[{title:'Fase 1 — Fundação',sub:'Meses 1–2',starts:0,ends:1,color:'red'},{title:'Fase 2 — Ativação',sub:'Meses 3–4',starts:2,ends:4,color:'gold'},{title:'Fase 3 — Escala',sub:'Meses 5–8',starts:4,ends:8,color:'teal'},{title:'Fase 4 — Consolidação',sub:'Meses 9–12',starts:8,ends:11,color:'purple'}];
var bars=[{label:'E-commerce',sub:'Funil+Conversão',starts:0,ends:2,color:'red'},{label:'Conteúdo & Social',sub:'Pilares+Calendário',starts:0,ends:4,color:'purple'},{label:'Meta Ads',sub:'Topo+Remarketing',starts:0,ends:5,color:'teal'},{label:'Posicionamento',sub:'Marca+Copy',starts:1,ends:3,color:'gold'},{label:'WhatsApp Funil',sub:'Automação',starts:1,ends:4,color:'blue'},{label:'Pré-show Eventos',sub:'Campanhas',starts:2,ends:7,color:'red'},{label:'Google Ads',sub:'Search+Remarketing',starts:2,ends:8,color:'teal'},{label:'Programa Revendas',sub:'Kit+Captação',starts:3,ends:7,color:'green'},{label:'Automação IA',sub:'Todas as áreas',starts:5,ends:11,color:'purple'},{label:'Expansão Revendas',sub:'10+ parceiros',starts:6,ends:10,color:'green'},{label:'Review & Escala',sub:'Consolidação',starts:9,ends:11,color:'gold'}];
function rows(data){return data.map(function(b){var cells=months.map(function(_,i){var a=i>=b.starts&&i<=b.ends;return'<div class="g-cell '+(i===0?'g-today':'')+'">'+( a?'<div class="g-bar '+b.color+'"></div>':'')+'</div>';}).join('');return'<div class="gantt-row"><div class="g-label">'+(b.title||b.label)+'<div class="gs">'+(b.sub||'')+'</div></div>'+cells+'</div>';}).join('');}
var head='<div class="gantt-head"><div></div>'+months.map(function(m,i){return'<div class="g-month '+(i===0?'g-today':'')+'">'+m+'</div>';}).join('')+'</div>';
el.innerHTML='<div class="ph"><h1>Roadmap 2026–2027</h1><p>Visão anual por fase e canal</p></div>'
+'<div class="card" style="margin-bottom:18px"><div class="card-title"><div class="cdot gold"></div>Fases</div><div class="gantt"><div class="gantt-grid">'+head+rows(phases)+'</div></div></div>'
+'<div class="card"><div class="card-title"><div class="cdot red"></div>Por Canal</div><div class="gantt"><div class="gantt-grid">'+head+rows(bars)+'</div></div></div>';
}
// ── MÓDULOS ──────────────────────────────────────────────────────

el.innerHTML='<div class="ph"><h1>Módulos Estratégicos</h1></div>'
+'<div class="mod-grid">'+MODULOS.map(function(m){return'<div class="mod-card" onclick="showModDetail('+m.id+')">'+'<div class="mod-num">MÓDULO 0'+m.id+'</div><div class="mod-name">'+m.name+'</div><div class="mod-role">'+m.role+'</div><div class="mod-foot"><span class="badge badge-'+(m.status==='active'?'active':'pending')+'">'+(m.status==='active'?'Em andamento':'Pendente')+'</span><span class="badge badge-'+tipoBadge(m.tipo)+'">'+m.tipo+'</span></div><div class="mini-prog"><div class="mini-prog-fill prog-fill '+m.color+'" style="width:'+m.pct+'%"></div></div></div>';}).join('')+'</div>'

}

+'<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><div class="av '+m.owner_color+'">'+m.initials+'</div><div><div style="font-size:13px;font-weight:600">'+m.owner+'</div><div style="font-size:11px;color:var(--muted)">'+m.role+'</div></div><div style="margin-left:auto;font-family:var(--ff-m);font-size:13px;color:var(--muted2)">'+m.pct+'% concluído</div></div>'

det.scrollIntoView({behavior:'smooth',block:'start'});
